  ["Locked. The farmer must keep the key somewhere... farmers love hay bales.", "Verschlossen. Der Bauer muss den Schlüssel irgendwo haben... Bauern lieben Heuballen.", "Bschlosse. De Puur het de Schlüssel sicher irgendwo... Pure liebed Heuballe."],

  ["Hotel guests only, lady. And— is that... a SNOW TIGER?!", "Nur für Hotelgäste, junge Frau. Und— ist das... ein SCHNEETIGER?!", "Nur für Hotelgäscht, Fräulein. Und— isch das... en SCHNEETIGER?!"],
  ["*purrrrRRRRRR*", "*schnurrrrRRRRRR*", "*schnurrrrRRRRRR*"], ["I'm on my break. A LONG break. Bye!", "Ich mache Pause. Eine LANGE Pause. Tschüss!", "Ich mach Pause. E LANGI Pause. Tschüss!"], ["Good kitty. 🐯", "Braves Kätzchen. 🐯", "Bravs Büsi. 🐯"],
  ["Hotel guests only.", "Nur für Hotelgäste.", "Nur für Hotelgäscht."], ["I'm an architect.", "Ich bin Architektin.", "Ich bi Architektin."], ["That's not a room number.", "Das ist keine Zimmernummer.", "Das isch kei Zimmernummere."],
  ["(He's scary. I need someone even scarier on my side...)", "(Er ist furchteinflössend. Ich brauche jemanden, der noch furchteinflössender ist...)", "(Dä isch gfürchig. Ich bruuch öpper, wo no gfürchiger isch...)"],
  ["The guard is busy with his risotto. In we go.", "Der Wächter ist mit seinem Risotto beschäftigt. Rein da.", "De Wächter isch mit sim Risotto beschäftigt. Ine mit üs."],
  ["Closed tonight. Unless... are those Steinpilze?!", "Heute Abend geschlossen. Ausser... sind das Steinpilze?!", "Hüt am Abig zue. Ussert... sind das Steipilz?!"],
  ["Five beautiful mushrooms. For your risotto.", "Fünf wunderschöne Pilze. Für dein Risotto.", "Föif wunderschöni Pilz. Für dis Risotto."],
  ["...I didn't see anything. Mind the night guard inside, though.", "...Ich habe nichts gesehen. Pass aber drinnen auf den Nachtwächter auf.", "...Ich ha nüt gseh. Pass aber dinne uf de Nachtwächter uf."],
  ["Closed tonight. Private garden party.", "Heute Abend geschlossen. Private Gartenparty.", "Hüt am Abig zue. Privati Gartepartie."],

  ["(I have {0}. To the forest!)", "(Ich habe {0}. Ab in den Wald!)", "(Ich ha {0}. Ab in Wald!)"],
  ["BOLLEBLU WATERSLIDE PARK — \"Opens for complete sketchbooks only.\" ({0}/5)", "RUTSCHBAHN-PARK BOLLEBLU — \"Öffnet nur für volle Skizzenbücher.\" ({0}/5)", "RUTSCHBAHN-PARK BOLLEBLU — \"Gaht nur für volli Skizzebüecher uf.\" ({0}/5)"],
  ["...that is oddly specific. C-Real.", "...das ist verdächtig spezifisch. C-Real.", "...das isch verdächtig spezifisch. C-Real."],
  ["❄️ Five sketches?! You did it!! The tallest waterslide in the world is yours. See you at the bottom! 💙", "❄️ Fünf Skizzen?! Du hast es geschafft!! Die höchste Wasserrutsche der Welt gehört dir. Wir sehen uns unten! 💙", "❄️ Föif Skizze?! Du hesch es gschafft!! Di höchscht Rutschbahn vo de Wält ghört dir. Mer gsehnd üs dunne! 💙"],
  ["WATERSLIDE!!! 🌊", "WASSERRUTSCHE!!! 🌊", "RUTSCHBAHN!!! 🌊"],
  ["Our home. ❤ The plants need water. That's C-Real's job. (They're doomed.)", "Unser Zuhause. ❤ Die Pflanzen brauchen Wasser. Das ist C-Reals Job. (Sie sind verloren.)", "Üses Dihei. ❤ D Pflanze bruuched Wasser. Das isch em C-Real sin Job. (Die sind verlore.)"],
  ["Peeking through the window: beige everything. Not worth a break-in.", "Blick durchs Fenster: alles beige. Keinen Einbruch wert.", "Durs Fänschter gluegt: alles beige. Kei Ibruch wärt."],
  ["A 70s chalet with an exquisite wooden ceiling... oh wait, that's a water stain.", "Ein 70er-Chalet mit einer exquisiten Holzdecke... ach nein, das ist ein Wasserfleck.", "Es 70er-Chalet mit ere exquisite Holzdecki... ah nei, das isch en Wasserfläck."],
  ["They have a Wagenfeld lamp. Respect. But no.", "Die haben eine Wagenfeld-Lampe. Respekt. Aber nein.", "Die händ e Wagenfeld-Lampe. Respekt. Aber nei."],
  ["The window's still open. Zumthor would not approve of the draft.", "Das Fenster ist noch offen. Zumthor wäre mit dem Durchzug nicht einverstanden.", "S Fänschter isch no offe. De Zumthor hät kei Freud am Durzug."],
  ["A window, slightly open. Architect's privilege! *climbs in*", "Ein Fenster, leicht geöffnet. Architektinnen-Privileg! *klettert hinein*", "Es Fänschter, chli offe. Architektinne-Privileg! *chlätteret ine*"],
  ["You dig through the hay... a key! Labelled \"Stall Vrin\". 🗝", "Du wühlst im Heu... ein Schlüssel! Beschriftet mit \"Stall Vrin\". 🗝", "Du nuuschisch im Heu... en Schlüssel! Aagschribe: \"Stall Vrin\". 🗝"],

  ["Ah, Sarah! Grüezi and welcome to REIBBIER — the most secret brewery in Luzern. I'm Braumeister Elio. 🍺", "Ah, Sarah! Grüezi und willkommen bei REIBBIER — der geheimsten Brauerei von Luzern. Ich bin Braumeister Elio. 🍺", "Ah, Sarah! Grüezi und willkomme bi REIBBIER — de gheimschte Brauerei vo Lozärn. Ich bi de Braumeister Elio. 🍺"],
  ["There's a BREWERY under our house?!", "Unter unserem Haus ist eine BRAUEREI?!", "Under üsem Huus hets e BRAUEREI?!"],
  ["C-Real rents me the cellar. He pays... in tasting. Lots of tasting.", "C-Real vermietet mir den Keller. Bezahlt wird... in Degustation. Viel Degustation.", "De C-Real vermietet mer de Chäller. Zahlt wird... mit Degustiere. Vill Degustiere."],
  ["That explains a LOT.", "Das erklärt EINIGES.", "Das erklärt EINIGS."],
  ["I'm developing some very, uh, experimental craft beers. Help me at the big copper kettle on the right!", "Ich entwickle ein paar sehr, äh, experimentelle Craft-Biere. Hilf mir am grossen Kupferkessel rechts!", "Ich entwickle es paar sehr, äh, experimentelli Craft-Bier. Hilf mer am grosse Chupferchessel rächts!"],

  ["My hair is about 30% hops by now.", "Meine Haare bestehen inzwischen zu 30% aus Hopfen.", "Mini Haar sind inzwüsche öppe 30% Hopfe."],

  ["C-Real promised to stop \"quality-controlling\" the Snow Tiger Sour. He did not stop.", "C-Real hat versprochen, das Schneetiger Sour nicht mehr zu \"kontrollieren\". Er hat nicht aufgehört.", "De C-Real het versproche, s Schneetiger Sour nümm z \"kontrolliere\". Er het nöd ufghört."],
  ["Monks called beer \"liquid bread\". I call it breakfast.", "Mönche nannten Bier \"flüssiges Brot\". Ich nenne es Frühstück.", "D Mönch händ em Bier \"flüssigs Brot\" gseit. Ich säg em Zmorge."],
  ["That Golden Reibbier was legendary, Sarah. Come back for more weird brews!", "Das Goldene Reibbier war legendär, Sarah. Komm wieder für mehr verrückte Biere!", "S Goldige Reibbier isch legendär gsi, Sarah. Chumm wieder für meh verruckti Bier!"],

  ["Then pour the perfect glass. Careful: the foam keeps rising after you stop!", "Dann zapf das perfekte Glas. Vorsicht: Der Schaum steigt weiter, wenn du aufhörst!", "Denn zapf s perfekte Glas. Obacht: De Schuum stiigt wiiter, wenn du ufhörsch!"],

const POUR_TARGET = .88;
let BR = null;
function brewStation() {

function resetBrewRound() { Object.assign(BR, { phase: 'order', t: 0, x: VW / 2, items: [], got: [], wrong: 0, spawnT: .3, fill: 0, foam: 0, pouring: false, released: false, settle: 0, stars: 0, spilled: false, msg: '' }); }

function updateBrew(dt) {
  const B = BR, beer = B.beers[B.round];
  if (inp.b && B.phase !== 'done') { leaveBrew(); return; }
  B.t += dt;
  if (B.phase === 'order') { if (inp.a) { B.phase = 'catch'; B.t = 0; } return; }
  if (B.phase === 'catch') {
    B.x = clamp(B.x + inp.ax * 200 * dt, 70, VW - 40);
    B.spawnT -= dt;
    if (B.spawnT <= 0) {
      B.spawnT = Math.max(.3, .55 - B.round * .08);
      const need = beer.ing.filter(e => !B.got.includes(e)), pool = BREW_POOL.filter(e => !beer.ing.includes(e));
      const e = need.length && rnd() < .42 ? need[(rnd() * need.length) | 0] : pool[(rnd() * pool.length) | 0];
      B.items.push({ e, x: 70 + rnd() * (VW - 110), y: 26, vy: 55 + rnd() * 30 + B.round * 15, rot: rnd() * 6 });
    }
    for (let i = B.items.length - 1; i >= 0; i--) {
      const it = B.items[i]; it.y += it.vy * dt; it.rot += dt * 2;
      if (it.y > 158 && it.y < 176 && Math.abs(it.x - B.x) < 22) {
        B.items.splice(i, 1);
        if (beer.ing.includes(it.e)) { if (!B.got.includes(it.e)) { B.got.push(it.e); sfx.pick(); popText(B.x, 140, '✓ ' + it.e, '#9fe0a0', 'screen'); } }
        else { B.wrong++; sfx.eww(); shake = .15; popText(B.x, 140, it.e + ' ' + t(it.e === '🧦' ? 'A SOCK?!' : BREW_WEIRD[(rnd() * BREW_WEIRD.length) | 0]), '#ffb070', 'screen'); }
        continue;
      }
      if (it.y > VH + 10) B.items.splice(i, 1);
    }
    if (B.got.length === beer.ing.length || B.t > 20) { B.phase = 'pour'; B.items = []; B.t = 0; }
    return;
  }
  if (B.phase === 'pour') {
    if (!B.released) {
      if (inp.aHeld) { B.fill += dt * .42; B.pouring = true; if (rnd() < dt * 14) noise(.05, .03, 500); }
      else if (B.pouring) B.released = true;
      if (B.fill >= 1) B.released = true;
    } else {
      B.settle += dt; B.foam = Math.min(.13, B.foam + dt * .26);
      if (B.settle > .7) rateBeer();
    }
    return;
  }
  if (B.phase === 'rate') { if (inp.a) { B.round++; if (B.round >= 3) finishBrew(); else resetBrewRound(); } return; }
  if (B.phase === 'done' && (inp.a || inp.b)) leaveBrew();
}
function rateBeer() {
  const B = BR, beer = B.beers[B.round], level = B.fill + B.foam, off = Math.abs(level - POUR_TARGET);
  const ing = clamp(B.got.length / beer.ing.length * 2 - B.wrong * .5, 0, 2);
  B.spilled = level > 1.02;
  const pour = B.spilled ? 0 : off < .04 ? 1 : off < .1 ? .5 : 0;
  B.stars = Math.round((ing + pour) * 2) / 2; B.total += B.stars; B.phase = 'rate';
  B.msg = B.stars >= 3 ? 'PERFEKT! This goes straight on the tap list! 🍺' : B.stars >= 2 ? 'Mmh! Weird. Wonderful. Weirdly wonderful.' : B.stars >= 1 ? 'It\'s... a beer. Technically.' : '*cough* ...I\'ll use it to clean the kettles.';
  if (B.stars >= 2) sfx.ding(); else sfx.bonk();
}
function finishBrew() {
  const B = BR; B.phase = 'done'; B.reward = false;
  ST.stats.beers = (ST.stats.beers || 0) + 3; ST.hearts = ST.maxHearts;
  if (B.total >= 6 && !ST.flags.brew) { ST.flags.brew = 1; ST.maxHearts = Math.min(6, ST.maxHearts + 1); ST.hearts = ST.maxHearts; B.reward = true; toast('❤ Golden Reibbier! +1 max heart'); }

// ---------------------------------------------------------------- update
function update(dt) {
  if (inp.mute) { muted = !muted; toast(muted ? '🔇 Sound off' : '🔊 Sound on', 1.5); }
  for (let i = toasts.length - 1; i >= 0; i--) { toasts[i].t -= dt; if (toasts[i].t <= 0) toasts.splice(i, 1); }
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.x += (p.vx || 0) * dt; p.y += p.vy * dt; if (p.heart) p.vy += 30 * dt; if (p.life <= 0) parts.splice(i, 1); }
  shake = Math.max(0, shake - dt);
  if (fade.dir === 1) { fade.a += dt * 4; if (fade.a >= 1) { fade.a = 1; fade.dir = -1; const c = fade.cb; fade.cb = null; c && c(); } return; }
  if (fade.dir === -1) { fade.a -= dt * 3; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
  const mus = scene === 'interior' && IN && IN.d.brewery ? 'brew' : { world: 'world', interior: 'interior', rope: 'world', slide: 'slide', ending: 'ending', brewgame: 'brew' }[scene];
  if (!paused) music(dt, mus);
  if (dlg.cur) {
    const len = dlg.cur.text.length;
    if (dlg.shown < len) { dlg.shown = Math.min(len, dlg.shown + dt * 55); dlg.blipT -= dt; if (dlg.blipT <= 0) { sfx.blip(); dlg.blipT = .07; } }
    if (inp.a) { if (dlg.shown < len) dlg.shown = len; else nextLine(); }
    return;
  }
  if (book.open) {
    if (inp.left) { book.sel = (book.sel + 4) % 5; sfx.blip(); }
    if (inp.right) { book.sel = (book.sel + 1) % 5; sfx.blip(); }
    if (inp.book || inp.pause || inp.a || inp.b) book.open = false;
    return;
  }
  if (paused) { if (inp.left || inp.right) { cycleLang(inp.left ? -1 : 1); sfx.blip(); } if (inp.pause || inp.a) paused = false; return; }
  switch (scene) {
    case 'title': updateTitle(dt); break;
    case 'world': updateWorld(dt); break;
    case 'interior': updateInterior(dt); break;
    case 'rope': updateRope(dt); break;
    case 'slide': updateSlide(dt); break;
    case 'ending': updateEnding(dt); break;
    case 'brewgame': updateBrew(dt); break;
  }
}
function updateTitle() {
  title.hasSave = !!loadGame();
  const n = title.hasSave ? 3 : 2;
  if (inp.up || inp.down) { title.sel = (title.sel + (inp.up ? -1 : 1) + n) % n; sfx.blip(); }
  if (title.sel >= n) title.sel = 0;
  if (title.sel === n - 1 && (inp.a || inp.left || inp.right)) { cycleLang(inp.left ? -1 : 1); sfx.blip(); return; }
  if (inp.left || inp.right) { cycleLang(inp.left ? -1 : 1); sfx.blip(); }
  if (inp.a) { audioInit(); sfx.ding(); const cont = title.hasSave && title.sel === 0; transition(() => cont ? continueGame() : newGame()); }
}
function updatePlayer(dt, solid) {
  let ax = inp.ax, ay = inp.ay; const l = Math.hypot(ax, ay); if (l > 1) { ax /= l; ay /= l; }
  const sp = (P.bike ? 120 : 66) * (P.slow > 0 ? .45 : 1);
  move(P, (ax * sp + P.kx) * dt, (ay * sp + P.ky) * dt, solid);
  const damp = Math.pow(.004, dt); P.kx *= damp; P.ky *= damp;
  P.moving = l > .1;
  if (P.moving) { P.anim += dt; if (Math.abs(ax) > Math.abs(ay)) P.dir = ax < 0 ? 'left' : 'right'; else P.dir = ay < 0 ? 'up' : 'down'; }
  P.jump = Math.max(0, P.jump - dt); P.inv = Math.max(0, P.inv - dt); P.slow = Math.max(0, P.slow - dt); P.trip = Math.max(0, P.trip - dt);
}
function worldInteractables() {

      txt(`★ ${B.total} / 9`, VW / 2 + 20, 66, 14, '#fff', 'center', true, false);
      txt(t('Prost! 🍻 Hearts restored.'), VW / 2 + 20, 88, 8, '#eee', 'center', false, false);
      if (B.reward) txt(t('❤ Golden Reibbier! +1 max heart'), VW / 2 + 20, 102, 8.5, '#ff9ab8', 'center', true, false);
      txt(t('[A]: back to the cellar'), VW / 2 + 20, 122, 7.5, '#ffd34d', 'center', true, false);
    }
    for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / p.max * 2); txt(p.text || '', p.x, p.y, 8, p.col, 'center', true); ctx.globalAlpha = 1; }
  }
  // toasts
  toasts.forEach((t, i) => {
    const a = Math.min(1, t.t * 2, (t.max - t.t) * 4), w = Math.min(230, wrap(t.text, 220, 7.5)[0] ? 230 : 230);
    const lines = wrap(t.text, 214, 7.5), h = 8 + lines.length * 9;
    const x = VW - w - 6 + (1 - Math.min(1, (t.max - t.t) * 4)) * 40, y = 34 + i * 34;
    ctx.globalAlpha = Math.max(0, a); rrect(x, y, w, h, 6, 'rgba(250,250,255,.95)', '#ffd34d');
    lines.forEach((ln, j) => txt(ln, x + 7, y + 4 + j * 9, 7.5, '#222', 'left', false, false)); ctx.globalAlpha = 1;
  });
  if (book.open) drawBook();
  if (paused) drawPause();
  drawDialog();
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, VW, VH);
  rrect(VW / 2 - 120, 30, 240, 156, 8, 'rgba(18,16,28,.95)', '#ff8fb1');
  txt(t('PAUSED'), VW / 2, 38, 14, '#fff', 'center', true, false);
  ['Move: Arrow keys / WASD / stick', '[A]: talk · pet · rope skip', 'Hold [A] at a ✨ spot to sketch it', 'B (B, Shift): hop on / off the black bike', 'Book (Tab, Q): your sketchbook', 'M: mute · Esc / P: pause', '', 'Avoid guard flashlight cones & lions.', 'Jump over lion poop. Pet cats. ❤', t('◀ ▶ Language: {0}', LANG_NAMES[LANG]), 'Press [A] or Esc to continue']
    .forEach((s, i) => txt(s ? t(s) : '', VW / 2, 60 + i * 10.5, 7.5, i >= 9 ? '#ffd34d' : '#ddd', 'center', i === 9, false));
}
function pencil(fn) { ctx.save(); ctx.strokeStyle = '#4a4a52'; ctx.lineWidth = .7; ctx.lineCap = 'round'; fn(); ctx.restore(); }
function jline(x0, y0, x1, y1, seed = 1) { const r = mulberry32(seed + Math.round(x0 * 7 + y0 * 13)); ctx.beginPath(); ctx.moveTo(x0 + (r() - .5), y0 + (r() - .5)); ctx.lineTo((x0 + x1) / 2 + (r() - .5) * 1.4, (y0 + y1) / 2 + (r() - .5) * 1.4); ctx.lineTo(x1 + (r() - .5), y1 + (r() - .5)); ctx.stroke(); }
function jpoly(pts, close = true) { for (let i = 0; i < pts.length - (close ? 0 : 1); i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; jline(a[0], a[1], b[0], b[1], i); } }
function drawSketch(id, x, y, w, h) {
  const cx = x + w / 2, cy = y + h / 2;
  pencil(() => {
    if (id === 'holz') {
      jpoly([[x + 10, cy - 18], [cx - 6, cy - 18], [cx - 6, cy + 18], [x + 10, cy + 18]]);
      for (let i = -1; i <= 1; i++) { const yy = cy + i * 12; jpoly([[cx - 6, yy - 3], [cx + 10, yy - 6], [cx + 10, yy + 6], [cx - 6, yy + 3]]); }
      jpoly([[cx + 10, cy - 18], [x + w - 10, cy - 18], [x + w - 10, cy + 18], [cx + 10, cy + 18]], false);
      for (let i = 0; i < 6; i++) jline(x + 14 + i * 5, cy - 14, x + 16 + i * 5, cy + 14, i);
    }
    if (id === 'chapel') {
      ctx.beginPath(); ctx.moveTo(cx, y + 8); ctx.bezierCurveTo(cx + 40, y + 20, cx + 30, y + h - 8, cx, y + h - 8); ctx.bezierCurveTo(cx - 30, y + h - 8, cx - 40, y + 20, cx, y + 8); ctx.stroke();
      for (let i = 0; i < 16; i++) { const t = i / 16 * Math.PI * 2, px = cx + Math.sin(t) * 20, py = cy + 4 - Math.cos(t) * 24 * (Math.cos(t) > 0 ? 1 : .8); ctx.beginPath(); ctx.arc(px, py, 1.2, 0, 7); ctx.stroke(); }
      for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + w - 28 + i * 6 + (j % 2) * 3, y + 10 + j * 5, 3, 0, Math.PI); ctx.stroke(); }
    }
    if (id === 'stall') {
      for (let j = 0; j < 7; j++) { const yy = y + 14 + j * 7; if (j % 2) jpoly([[x + 12, yy], [x + w - 30, yy], [x + w - 30, yy + 6], [x + 12, yy + 6]]); else { jpoly([[x + 20, yy], [x + w - 12, yy], [x + w - 12, yy + 6], [x + 20, yy + 6]]); ctx.beginPath(); ctx.arc(x + w - 12, yy + 3, 3, 0, 7); ctx.stroke(); } }
      jline(x + w - 30, y + 10, x + w - 30, y + h - 8, 9);
    }
    if (id === 'therme') {
      for (let j = 0; j < 18; j++) { const yy = y + 10 + j * 3.2; jline(x + 10, yy, cx - 8 - (j % 3) * 4, yy, j); jline(cx + 8 + (j % 2) * 5, yy, x + w - 10, yy, j + 30); }
      ctx.save(); ctx.strokeStyle = 'rgba(230,180,40,.8)'; jline(cx - 2, y + 4, cx - 6, y + h - 6, 3); jline(cx + 2, y + 4, cx + 6, y + h - 6, 4); ctx.restore();
      ctx.beginPath(); for (let i = 0; i < 5; i++) { ctx.moveTo(x + 16 + i * 14, y + h - 10); ctx.quadraticCurveTo(x + 23 + i * 14, y + h - 13, x + 30 + i * 14, y + h - 10); } ctx.stroke();
    }
    if (id === 'pav') {
      ctx.save(); ctx.fillStyle = 'rgba(30,30,30,.25)'; ctx.fillRect(x + 10, y + 8, w - 20, h - 16); ctx.restore();
      jpoly([[x + 10, y + 8], [x + w - 10, y + 8], [x + w - 10, y + h - 8], [x + 10, y + h - 8]]);
      jpoly([[x + 22, y + 18], [x + w - 22, y + 18], [x + w - 22, y + h - 18], [x + 22, y + h - 18]]);
      ctx.save(); ctx.fillStyle = '#f7f0dc'; ctx.fillRect(x + 23, y + 19, w - 46, h - 38); ctx.restore();
      for (let i = 0; i < 26; i++) { const r = mulberry32(i); const px = x + 26 + r() * (w - 52), py = y + 22 + r() * (h - 44); ctx.beginPath(); ctx.moveTo(px, py + 4); ctx.lineTo(px, py); ctx.stroke(); ctx.beginPath(); ctx.arc(px, py - 1, 1.2, 0, 7); ctx.stroke(); }
    }
  });
}
function drawBook() {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, VW, VH);
  const bx = 34, by = 14, bw = VW - 68, bh = VH - 28;
  rrect(bx - 4, by - 4, bw + 8, bh + 8, 8, '#5b3a22'); rrect(bx, by, bw, bh, 5, '#fbf5e4');
  for (let y = by + 8; y < by + bh - 4; y += 9) { ctx.fillStyle = '#5b3a22'; ctx.beginPath(); ctx.arc(bx + bw / 2, y, 1.6, 0, 7); ctx.fill(); }
  const id = PAGE_ORDER[book.sel], d = INTERIORS[id], have = !!ST.sk[id];
  txt(t('My Architectural Sketchbook — page {0}/5', book.sel + 1), bx + 10, by + 6, 7, '#8a6a48', 'left', true, false);
  rrect(bx + 12, by + 22, bw / 2 - 24, bh - 54, 3, '#fffdf4', '#e3d8bb');
  if (have) drawSketch(id, bx + 12, by + 22, bw / 2 - 24, bh - 54);
  else { txt('?', bx + bw / 4, by + 60, 30, '#d8ccb0', 'center', true, false); }
  const rx = bx + bw / 2 + 10, rw = bw / 2 - 22;
  wrap(t(have ? d.title : '??? (not yet sketched)'), rw, 10, true).slice(0, 2).forEach((ln, i) => txt(ln, rx, by + 22 + i * 11, 10, '#3a2a1a', 'left', true, false));
  const tl = wrap(t(have ? d.title : '??? (not yet sketched)'), rw, 10, true).length > 1 ? 11 : 0;
  txt(have ? t(d.sub) : t('Somewhere {0}...', t(d.where)), rx, by + 36 + tl, 7, '#8a6a48', 'left', false, false);
  wrap(t(have ? d.fact : 'A locked building with a beautiful detail inside. Find a way in, avoid the guards, and hold [A] at the ✨ spot.'), rw, 7.5).forEach((ln, i) => txt(ln, rx, by + 50 + tl + i * 10, 7.5, '#3a3a3a', 'left', false, false));
  for (let i = 0; i < 5; i++) { ctx.fillStyle = i === book.sel ? '#ff6fa8' : ST.sk[PAGE_ORDER[i]] ? '#7ec850' : '#d8ccb0'; ctx.beginPath(); ctx.arc(VW / 2 - 24 + i * 12, by + bh - 12, 3.2, 0, 7); ctx.fill(); }
  txt(t('◀ ▶ flip pages   ·   [A] / Tab: close'), VW / 2, by + bh - 26, 7, '#8a6a48', 'center', false, false);
}

// ---------------------------------------------------------------- render & loop
function render() {
  g = lowCtx; g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingEnabled = false;
  if (scene === 'title') drawTitleScene();
  else if (scene === 'world') drawWorld();
  else if (scene === 'interior') drawInterior();
  else if (scene === 'rope') drawRopeScene();
  else if (scene === 'slide') drawSlideScene();
  else if (scene === 'ending') drawEndingScene();
  else if (scene === 'brewgame') drawBrewScene();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (P.trip > 0 && (scene === 'world' || scene === 'interior')) {
    const k = Math.min(1, P.trip / 2), sx = cv.width / VW, sy = cv.height / VH;
    ctx.filter = `hue-rotate(${Math.round(time * 120 * k) % 360}deg) saturate(${1 + .8 * k})`;
    for (let yy = 0; yy < VH; yy += 4) ctx.drawImage(low, 0, yy, VW, 4, Math.sin(time * 3 + yy * .08) * 4 * k * sx, yy * sy, cv.width, Math.ceil(4 * sy) + 1);
    ctx.filter = 'none';
  } else ctx.drawImage(low, 0, 0, cv.width, cv.height);
  ctx.setTransform(cv.width / VW, 0, 0, cv.height / VH, 0, 0);
  drawUI();
  if (fade.a > 0) { ctx.fillStyle = `rgba(8,6,14,${fade.a})`; ctx.fillRect(0, 0, VW, VH); }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  pollInput(); update(dt); render(); clearPressed();
  requestAnimationFrame(loop);
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => { });
buildTiles(); genWorld(); spawnEntities();
title.hasSave = !!loadGame();
requestAnimationFrame(loop);
</script>
